# wgpu 30 needs rustc 1.87 or newer, and `build:wasm` needs the wasm32 target.
[toolchain]
channel = "1.99.0"
# wasm32 for the web adapter; the Android ABIs for water-ui-android (cargo ndk).
targets = [
    "wasm32-unknown-unknown",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
components = ["clippy", "rustfmt"]
